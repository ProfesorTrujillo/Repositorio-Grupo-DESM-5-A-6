<div class="viajes-list-container">
<div class="lista-header">
    <h2>Lista de Viajes</h2>
</div>

<div class="lista-vacia" *ngIf="viaje.length === 0">
    <span class="icono-vacio">🌍</span>
    <p>No hay viajes disponibles.</p>
</div>

<!--listado de viaje -->
<div class="grid" *ngIf="viaje.length > 0">
    <article class="card" *ngFor="let v of viaje; trackBy: trackByViajeId" [class.card-agotado]="!v.estado">
        <div class="card-imagen">
            <img [src]="v.imagen" [alt]="v. nombre">
        </div>
        <div class="card-content">
            <h3>{{v.nombre}}</h3>

            <p class="descripcion">{{v.descripcion}}</p>
            <p><strong>Categoría:</strong> {{v.categoria}}</p>
            </div>
    <footer class="card-footer">
    <p><strong>Precio:</strong> ${{ v.precio.toFixed(2) }}</p>
    <div class="card-acciones">

    <a class="btn-detalles" [routerLink]="['/detalles', v.id]">Detalles</a>
    </div>
    </footer>
    </article>
</div>
