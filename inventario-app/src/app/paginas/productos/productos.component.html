<h2>Gestión de Productos</h2>

<form (ngSubmit)="guardarProducto()">
  <input [(ngModel)]="producto.nombre" name="nombre" placeholder="Nombre del producto" required>
  <input type="number" [(ngModel)]="producto.precio" name="precio" placeholder="Precio" required>
  <input [(ngModel)]="producto.descripcion" name="descripcion" placeholder="Descripción del producto">
  <select [(ngModel)]="producto.categoria" name="categoria">
    <option *ngFor="let c of categorias" [value]="c">{{ c }}</option>
  </select>

  <div class="form-actions">
    <button type="submit">
      {{ estado === EstadoFormulario.Editando ? '✏️ Actualizar producto' : '＋ Guardar producto' }}
    </button>
    <button type="button" class="btn-cancelar" (click)="cancelar()">Cancelar</button>
  </div>
</form>

<hr>

<ul *ngIf="productos.length > 0; else sinProductos">
  <li *ngFor="let p of productos">
    <div class="producto-info">
      <div class="producto-nombre">{{ p.nombre }}</div>
      <div class="producto-meta">{{ p.categoria }} · {{ p.descripcion }}</div>
    </div>

    <div class="producto-precio">${{ p.precio }}</div>

    <div class="acciones">
      <button type="button" class="btn btn-editar"    (click)="editarProducto(p)">✏️ Editar</button>
      <button type="button" class="btn btn-eliminar"  (click)="eliminarProducto(p.id)">🗑 Eliminar</button>
      <button type="button" class="btn btn-whatsapp"  (click)="contactarPorWhatsapp(p)">WhatsApp</button>
      <button type="button" class="btn btn-facebook"  (click)="compartirFacebook(p)">Facebook</button>
      <button type="button" class="btn btn-twitter"   (click)="compartirTwitter(p)">X</button>
    </div>
  </li>
</ul>

<ng-template #sinProductos>
  <div class="empty">
    <div class="empty-icon">📦</div>
    <p>No hay productos registrados aún.<br>Agrega el primero usando el formulario.</p>
  </div>
</ng-template>
